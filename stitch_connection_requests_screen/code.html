<style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #FCFCFC;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-header-bg dark:bg-surface-container-high w-full rounded-b-[15px] fixed top-0 left-0 right-0 z-50">
<div class="flex flex-row-reverse justify-between items-center px-gutter h-component-h w-full">
<div class="flex items-center">
<span class="font-user-name text-user-name text-primary dark:text-primary-fixed-dim">سِتِر</span>
</div>
<div class="font-screen-title text-screen-title text-primary dark:text-primary-fixed-dim">
                طلبات التواصل
            </div>
<button class="flex items-center justify-center w-header-icon h-header-icon transition-transform duration-200 active:scale-95 hover:bg-surface-variant/20 rounded-full">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-gutter pt-[54px] pb-[64px]">
<!-- Empty State Container -->
<div class="w-full max-w-sm flex flex-col items-center text-center animate-in fade-in zoom-in duration-700">
<!-- Illustrative Icon Area -->
<div class="relative mb-8 group">
<!-- Decorative background shapes -->
<div class="absolute inset-0 bg-surface-container-low rounded-full scale-150 blur-2xl opacity-50 group-hover:opacity-80 transition-opacity duration-500"></div>
<div class="relative w-32 h-32 bg-surface-container-low rounded-full flex items-center justify-center shadow-[0_3_64_0_rgba(0,0,0,0.06)]">
<span class="material-symbols-outlined text-[64px] text-on-surface-variant/40" data-icon="person_add" style="font-variation-settings: 'FILL' 0, 'wght' 200;">person_add</span>
<!-- Decorative floating spark -->
<div class="absolute -top-2 -right-2 w-8 h-8 bg-primary-fixed-dim rounded-full flex items-center justify-center animate-bounce duration-[3000ms]">
<span class="material-symbols-outlined text-white text-sm" data-icon="sparkles" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
</div>
</div>
</div>
<!-- Empty State Text -->
<h1 class="font-screen-title text-screen-title text-on-surface mb-2">
                لا توجد طلبات تواصل حالياً
            </h1>
<p class="font-body-row-label text-text-secondary max-w-[240px]">
                ستظهر الطلبات الجديدة هنا بمجرد وصولها.
            </p>
<!-- Optional CTA / Action (Implicitly subtle for empty states) -->
<button class="mt-8 px-8 py-3 bg-primary text-white rounded-full font-body-row-label shadow-[0_3_64_0_rgba(128,82,0,0.2)] transition-all duration-300 active:scale-95 hover:bg-primary/90">
                استكشاف الملفات
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex flex-row-reverse justify-around items-center h-[64px] px-2 bg-surface dark:bg-surface-container-lowest shadow-[0_-4px_32px_0_rgba(0,0,0,0.10)]">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-text-inactive dark:text-on-surface-variant transition-all duration-300 ease-in-out hover:bg-surface-container-low dark:hover:bg-surface-container-high w-1/5 h-full" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-nav-label text-nav-label">الرئيسية</span>
</a>
<!-- Notifications -->
<a class="flex flex-col items-center justify-center text-text-inactive dark:text-on-surface-variant transition-all duration-300 ease-in-out hover:bg-surface-container-low dark:hover:bg-surface-container-high w-1/5 h-full" href="#">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="font-nav-label text-nav-label">التنبيهات</span>
</a>
<!-- Messages (Active Context for Connection Requests Flow) -->
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim border-t-2 border-primary transition-all duration-300 ease-in-out w-1/5 h-full" href="#">
<span class="material-symbols-outlined" data-icon="chat_bubble" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
<span class="font-nav-label text-nav-label">الرسائل</span>
</a>
<!-- Packages -->
<a class="flex flex-col items-center justify-center text-text-inactive dark:text-on-surface-variant transition-all duration-300 ease-in-out hover:bg-surface-container-low dark:hover:bg-surface-container-high w-1/5 h-full" href="#">
<span class="material-symbols-outlined" data-icon="redeem">redeem</span>
<span class="font-nav-label text-nav-label">الباقات</span>
</a>
<!-- More -->
<a class="flex flex-col items-center justify-center text-text-inactive dark:text-on-surface-variant transition-all duration-300 ease-in-out hover:bg-surface-container-low dark:hover:bg-surface-container-high w-1/5 h-full" href="#">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
<span class="font-nav-label text-nav-label">المزيد</span>
</a>
</nav>
<script>
        // Simple touch interaction for visual feedback
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('touchstart', () => {
                el.classList.add('opacity-70');
            });
            el.addEventListener('touchend', () => {
                el.classList.remove('opacity-70');
            });
        });
    </script>
</body></html>
