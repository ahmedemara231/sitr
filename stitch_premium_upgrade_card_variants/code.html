<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary": "#ffffff",
                    "on-surface-variant": "#514536",
                    "on-tertiary-container": "#fcfcff",
                    "primary-container": "#a16902",
                    "darkGoldenRod": "#B47200",
                    "on-secondary-fixed-variant": "#474746",
                    "on-tertiary-fixed": "#001e30",
                    "error-container": "#ffdad6",
                    "on-secondary": "#ffffff",
                    "secondary": "#5f5e5e",
                    "outline-variant": "#d5c4b1",
                    "on-tertiary-fixed-variant": "#004b70",
                    "unselectedLabel": "#4F4F4F",
                    "mediumGray": "#525252",
                    "tertiary-fixed": "#cae6ff",
                    "textBlack": "#272727",
                    "secondary-fixed-dim": "#c8c6c5",
                    "error": "#D92D20",
                    "surface-container-highest": "#ede0d5",
                    "surface-tint": "#835400",
                    "secondary-fixed": "#e5e2e1",
                    "primary": "#805200",
                    "whiteScaffold": "#FCFCFC",
                    "tertiary-container": "#1f7bb0",
                    "secondary-container": "#e2dfde",
                    "tertiary-fixed-dim": "#8dcdff",
                    "surface-bright": "#fff8f4",
                    "surface-container": "#f8ece0",
                    "background": "#fff8f4",
                    "on-background": "#201b14",
                    "on-primary-container": "#fffbff",
                    "on-secondary-fixed": "#1b1c1b",
                    "on-primary-fixed": "#2a1800",
                    "on-surface": "#201b14",
                    "on-primary-fixed-variant": "#643f00",
                    "inverse-surface": "#362f28",
                    "inactiveField": "#F6F6F6",
                    "on-secondary-container": "#636262",
                    "surface": "#FFFFFF",
                    "primary-fixed-dim": "#ffb957",
                    "tertiary": "#006290",
                    "inverse-primary": "#ffb957",
                    "outline": "#837564",
                    "on-tertiary": "#ffffff",
                    "primary-fixed": "#ffddb5",
                    "on-error-container": "#93000a",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-low": "#fef1e6",
                    "inverse-on-surface": "#fbefe3",
                    "surface-dim": "#e4d8cd",
                    "surface-container-high": "#f3e6db",
                    "border": "#EEEEEE",
                    "on-error": "#ffffff",
                    "darkGray": "#3A3A3A",
                    "surface-variant": "#ede0d5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "16px",
                    "stack-lg": "24px",
                    "stack-sm": "8px",
                    "stack-md": "16px"
            },
            "fontFamily": {
                    "body-lg": ["Tajawal"],
                    "label-md": ["Tajawal"],
                    "body-md": ["Tajawal"],
                    "label-sm": ["Tajawal"],
                    "headline-lg": ["Tajawal"],
                    "headline-md": ["Tajawal"]
            },
            "fontSize": {
                    "body-lg": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "body-md": ["12px", {"lineHeight": "18px", "fontWeight": "500"}],
                    "label-sm": ["10px", {"lineHeight": "14px", "fontWeight": "400"}],
                    "headline-lg": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
                    "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .promotional-shimmer {
            background: linear-gradient(110deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 45%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.1) 55%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 4s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-whiteScaffold min-h-screen p-gutter font-body-md flex items-center justify-center">
<!-- Premium Promotional Card Hero Version 2 -->
<div class="relative w-full max-w-md overflow-hidden bg-primary rounded-xl shadow-[0_8px_30px_rgb(128,82,0,0.2)]">
<!-- Background Atmospheric Element (Geometric) -->
<div class="absolute -top-12 -left-12 w-48 h-48 bg-darkGoldenRod rounded-full opacity-30 mix-blend-screen blur-2xl"></div>
<div class="absolute -bottom-8 -right-8 w-32 h-32 bg-primary-container rounded-full opacity-40 mix-blend-screen blur-xl"></div>
<!-- Shimmer Overlay -->
<div class="absolute inset-0 promotional-shimmer pointer-events-none"></div>
<div class="relative z-10 p-stack-lg flex flex-col items-start gap-stack-md">
<!-- Icon/Badge Area -->
<div class="bg-on-primary/10 w-12 h-12 rounded-lg flex items-center justify-center backdrop-blur-sm border border-on-primary/20">
<span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">
                    workspace_premium
                </span>
</div>
<!-- Content Area -->
<div class="space-y-stack-sm text-right">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-primary tracking-tight">
                    رقّ ملفك الشخصي
                </h1>
<p class="font-body-lg text-body-lg text-on-primary/90">
                    احصل على مزايا حصرية ووصول غير محدود لأدوات سِتر المتطورة
                </p>
</div>
<!-- Features Bento-Lite Style -->
<div class="grid grid-cols-2 gap-stack-sm w-full mt-stack-sm">
<div class="bg-on-primary/5 rounded-lg p-3 flex items-center gap-2 border border-on-primary/10">
<span class="material-symbols-outlined text-on-primary text-lg">verified</span>
<span class="text-on-primary font-label-md text-label-md">توثيق الحساب</span>
</div>
<div class="bg-on-primary/5 rounded-lg p-3 flex items-center gap-2 border border-on-primary/10">
<span class="material-symbols-outlined text-on-primary text-lg">bolt</span>
<span class="text-on-primary font-label-md text-label-md">سرعة فائقة</span>
</div>
</div>
<!-- CTA Section -->
<div class="w-full pt-stack-sm">
<button class="group relative w-full h-[54px] bg-white rounded-full flex items-center justify-center gap-2 overflow-hidden transition-all active:scale-95 shadow-lg">
<span class="relative z-10 text-textBlack font-headline-md text-headline-md">
                        ابدأ الآن
                    </span>
<span class="material-symbols-outlined text-textBlack group-hover:translate-x-[-4px] transition-transform">
                        arrow_back
                    </span>
<!-- Button Hover Glow -->
<div class="absolute inset-0 bg-inactiveField opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</div>
</div>
<!-- Decorative Illustration Area -->
<div class="absolute top-4 left-4 w-32 h-32 opacity-10 pointer-events-none">
<div class="w-full h-full border-[8px] border-on-primary rounded-full rotate-45 border-dashed"></div>
</div>
</div>
<!-- Additional Micro-interaction Script -->
<script>
        document.querySelector('button').addEventListener('mousemove', (e) => {
            const rect = e.target.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            e.target.style.setProperty('--x', `${x}px`);
            e.target.style.setProperty('--y', `${y}px`);
        });
    </script>
</body></html>
