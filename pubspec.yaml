name: flutter_base
description: flutter_base_Project.
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  #  google_generative_ai: ^0.4.7
  flutter_ai_toolkit: ^0.10.0
  firebase_ai: ^3.2.0

#--------------------- Networks & Firebase -----------------------
  dio: ^5.7.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0


#--------------------- Localization & Internationalization -----------------------
  intl: 0.20.2
  easy_localization: ^3.0.7
#--------------------- Tools -----------------------
  image_picker: ^1.1.2
  file_picker: ^10.3.1
  image_cropper: ^9.1.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  dotted_border: ^3.1.0
  dropdown_search: ^6.0.2
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.2
  flutter_offline: ^5.0.0
  sliver_tools: ^0.2.12
  photo_view: ^0.15.0
  pinput: ^5.0.0
#--------------------- State Management & Utilities -----------------------
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  get_it: ^8.0.3
  multiple_result: ^5.1.0
  injectable: ^2.5.1
  pagify: ^0.2.2
  wakelock_plus: ^1.3.2

#--------------------- UI & Animations -----------------------
  flutter_spinkit: ^5.1.0
  easy_loading_button: ^0.4.0
  flutter_svg: ^2.1.0
  lottie: ^3.1.2
  skeletonizer: ^2.1.0+1
  flutter_html: ^3.0.0
  easy_timer_count: 0.0.2
  permission_handler: ^12.0.1

  #--------------------- Storage & Data -----------------------
  shared_preferences: ^2.2.3
  path: 1.9.1
  path_provider: ^2.1.3

#--------------------- Sharing & Links -----------------------
  share_plus: ^11.1.0
  url_launcher: ^6.3.0
  watcher: ^1.1.2

#--------------------- Genetaion_Models ---------------------- 
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0


  rename: ^3.1.0
  change_app_package_name: 1.5.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

dev_dependencies:
  build_runner: null
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_gen_runner: null
  flutter_lints: ^6.0.0
  injectable_generator: null
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/images/
    - assets/fonts/
    - assets/lottie/data/
    - assets/lottie/error/
    - assets/lottie/loading/
    - assets/lottie/network/
    - assets/lottie/success/
    - assets/translations/


  fonts:
    - family: Tajawal
      fonts:
      - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
        weight: 700   
      - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
        weight: 500
      - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
        weight: 400
      - asset: assets/fonts/Tajawal/Tajawal-Light.ttf
        weight: 300
      - asset: assets/fonts/Tajawal/Tajawal-ExtraLight.ttf
        weight: 200

flutter_gen:
  output: lib/src/config/res/
  line_length: 80
  integrations:
    lottie: true
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      class_name: AppAssets
