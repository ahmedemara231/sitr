flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

default_flavor: dev
dependency_overrides:
  connectivity_plus: ^6.1.1
  zego_express_engine: ^3.23.0
  pointycastle: ^4.0.0

dev_dependencies:
  sentry_dart_plugin: ^3.2.0
  objectbox_generator: ^5.2.0
  build_runner: ^2.12.2
#  freezed: ^2.5.2
#  json_serializable: ^6.8.0
  flutter_gen_runner: ^5.13.0
  flutter_lints: ^6.0.0
  injectable_generator: null
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true


  assets:
    - assets/svg/
    - assets/images/
    - assets/fonts/
    - assets/lottie/data/
    - assets/lottie/error/
    - assets/lottie/loading/
    - assets/lottie/network/
    - assets/lottie/success/
    - assets/translations/
    - shorebird.yaml


  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal/Tajawal-ExtraLight.ttf
          weight: 200
    - family: riyal
      fonts:
        - asset: assets/fonts/riyal.ttf
          weight: 700


flutter_gen:
  output: lib/src/config/res/
  line_length: 80
  integrations:
    lottie: true
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      class_name: AppAssets

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: satr
  org: aait-01
