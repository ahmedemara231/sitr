name: flutter_base
description: flutter_base_Project.
version: 1.0.12+18
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  #--------------------- Networks & Firebase -----------------------
  dio: ^5.7.0
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.4.0
  firebase_remote_config: ^6.2.0
  cloud_firestore: ^6.5.0

  #--------------------- Localization & Internationalization -----------------------
  intl: 0.20.2
  easy_localization: ^3.0.7
  #--------------------- Tools -----------------------
  app_tracking_transparency: ^2.0.7
  appsflyer_sdk: ^6.18.0
  nsfw_detector_flutter: ^2.0.0
  safe_text: ^2.1.5
  upgrader: ^13.3.0
  package_info_plus: ^8.3.1
  sentry_flutter: ^9.9.0
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  cached_network_image: ^3.4.1
  dropdown_search: ^6.0.2
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.2
  pinput: ^5.0.0
  pinch_zoom: ^2.0.1
  webview_flutter: ^4.13.0
  internet_connection_checker: ^3.0.1
  connectivity_plus: any

  zego_uikit_prebuilt_call: ^4.22.2
  zego_uikit_signaling_plugin: ^2.8.20
  zego_uikit: ^2.28.38
  zego_zpns: ^2.6.0


  #--------------------- State Management & Utilities -----------------------
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  get_it: ^8.0.3
  multiple_result: ^5.1.0
  injectable: ^2.5.1
  #--------------------- UI & Animations -----------------------
  flutter_spinkit: ^5.1.0
  toastification: ^3.0.3
  easy_loading_button: ^0.4.0
  easy_stepper: ^1.2.0

  flutter_svg: ^2.1.0
  lottie: ^3.1.2
  flutter_html: ^3.0.0
  permission_handler: ^12.0.1

  #--------------------- Storage & Data -----------------------
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  objectbox: ^5.2.0
  objectbox_flutter_libs: ^5.2.0

  #--------------------- Sharing & Links -----------------------
  share_plus: ^12.0.1
  url_launcher: ^6.3.0
  watcher: ^1.1.2

  #--------------------- mine ----------------------
  easy_timer_count: ^0.0.3
  pagify: ^0.3.2
  dropinity: 0.0.3
  #--------;------------- mine ----------------------

  rename: ^3.1.0
  change_app_package_name: 1.5.0
  flutter_launcher_icons: ^0.14.4
  socket_io_client: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0
  shorebird_code_push: ^2.0.5
  flutter_phoenix: ^1.1.1
  expandable_text: ^2.3.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

default_flavor: dev
dependency_overrides:
  connectivity_plus: ^6.1.1
  zego_express_engine: ^3.23.0
  pointycastle: ^4.0.0

dev_dependencies:
  sentry_dart_plugin: ^3.2.0
  objectbox_generator: ^5.2.0
  build_runner: ^2.12.2
#  freezed: ^2.5.2
#  json_serializable: ^6.8.0
  flutter_gen_runner: ^5.13.0
  flutter_lints: ^6.0.0
  injectable_generator: null
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true


  assets:
    - assets/svg/
    - assets/images/
    - assets/fonts/
    - assets/lottie/data/
    - assets/lottie/error/
    - assets/lottie/loading/
    - assets/lottie/network/
    - assets/lottie/success/
    - assets/translations/
    - shorebird.yaml


  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal/Tajawal-ExtraLight.ttf
          weight: 200
    - family: riyal
      fonts:
        - asset: assets/fonts/riyal.ttf
          weight: 700


flutter_gen:
  output: lib/src/config/res/
  line_length: 80
  integrations:
    lottie: true
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      class_name: AppAssets

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: satr
  org: aait-01
flutter_assets_generator:
  output_dir: generated/
  output_filename: assets
  class_name: Assets
  auto_detection: true
  # Automatically add missing dependencies (rive, flutter_svg, lottie) default: true
  auto_add_dependencies: true
  # Options: robust (default), legacy (old style)
  style: robust
  package_parameter_enabled: false
  named_with_parent: true
  path_ignore: [ ]
