</div>
<div class="flex-1 flex flex-col justify-between items-start text-right">
<div>

<p class="font-meta-data text-meta-data text-text-secondary mt-1">مهندس برمجيات | الرياض</p>
</div>
<div class="flex gap-2 mt-3 w-full">
<button class="bg-primary text-on-primary font-nav-label text-nav-label h-8 px-4 rounded-full">قبول</button>
<button class="bg-field-bg text-text-inactive font-nav-label text-nav-label h-8 px-4 rounded-full">تجاهل</button>

</div>
</div>

<script>
        // Simple micro-interaction for the "Back" button to demonstrate dismissal
        document.querySelectorAll('button').forEach(btn => {
            if(btn.innerText.includes('تراجع')) {
                btn.onclick = () => {
                    const sheet = document.querySelector('.bottom-sheet-up').parentElement;
                    const backdrop = document.querySelector('.fixed.inset-0');
                    const main = document.querySelector('main');
                    
                    sheet.style.transform = 'translateY(100%)';
                    sheet.style.transition = 'transform 0.3s ease-in';
                    backdrop.style.opacity = '0';
                    main.classList.remove('filter', 'brightness-50', 'contrast-75');
                    
                    setTimeout(() => {
                        sheet.remove();
                        backdrop.remove();
                    }, 300);
                }
            }
        });
    </script>
